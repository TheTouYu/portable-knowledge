[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-knowledge"
version = "0.1.0"
description = "Deterministic Portable Knowledge Core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pkc = "portable_knowledge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
