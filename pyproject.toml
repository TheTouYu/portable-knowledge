[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-knowledge"
version = "0.2.0rc4"
description = "Deterministic, local-first knowledge authority, retrieval, and transaction core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
# License classifier intentionally omitted until the owner selects an explicit
# software license.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/TheTouYu/portable-knowledge"
Repository = "https://github.com/TheTouYu/portable-knowledge.git"
Documentation = "https://github.com/TheTouYu/portable-knowledge#readme"

[project.scripts]
pkc = "portable_knowledge.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
